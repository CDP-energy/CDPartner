<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CDPartner 2027</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- =====================================
         HERO
    ====================================== -->

    <header class="hero">

        <!-- Barra superior -->

        <nav class="top-bar">

            <a href="#" aria-label="CDPartner">
                <img
                    src="cdpartner.png"
                    alt="CDPartner"
                    class="logo"
                >
            </a>

            <a
                href="https://cdpartneroficial.com/login?to=/rewards"
                class="login-button"
            >
                INICIAR SESIÓN
            </a>

        </nav>


        <!-- Contenido -->

        <div class="hero-content">

            <div class="hero-text">

                <div class="hero-kicker">
                    NUEVOS DESTINOS<br>
                    GRANDES HISTORIAS
                </div>


                <h1 class="hero-title">

                    ¿TE ATREVES A<br>

                    <span class="yellow">
                        DESCUBRIRLO?
                    </span>

                </h1>


                <p class="hero-description">

                    UNA NUEVA AVENTURA ESTÁ POR COMENZAR,<br>
                    MANTENTE ATENTO A LAS PRÓXIMAS PISTAS

                </p>


                <a
                    href="https://cdpartneroficial.com/login?to=/rewards"
                    class="register-button"
                >

                    REGÍSTRATE

                    <span>→</span>

                </a>


                <div class="hero-extra">
                    SÉ PARTE DE LO EXTRAORDINARIO
                </div>

            </div>

        </div>


        <!-- Indicador -->

        <a
            href="#contenido"
            class="scroll-indicator"
        >

            <div class="scroll-icon"></div>

            <span>
                DESLIZA Y DESCUBRE MÁS
            </span>

        </a>

    </header>


    <!-- =====================================
         ANCLA PARA LA SIGUIENTE SECCIÓN
    ====================================== -->

    <main id="contenido"></main>


</body>

</html>
